<script>
    const shot = new URLSearchParams(location.search).get('shot');
    const clickText = (text) => {
        const button = [...document.querySelectorAll('button')].find((item) => item.textContent.trim() === text);
        button?.click();
        return !!button;
    };
    if (shot) {
        const timer = setInterval(() => {
            if (!document.querySelector('.q-card')) return;
            clearInterval(timer);
            if (shot === 'confirm') {
                document.querySelector('.q-card input[type=checkbox]').click();
                setTimeout(() => clickText('删除'), 150);
            } else if (shot === 'new') {
                clickText('新建题目');
            } else if (shot === 'paper') {
                location.hash = '#/papers';
                setTimeout(() => clickText('新建试卷'), 400);
            } else if (shot === 'design') {
                clickText('试卷设计');
            }
        }, 100);
    }
</script>
