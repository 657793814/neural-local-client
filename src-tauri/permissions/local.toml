# 本机窗口（主界面、选区层、取题工具条）能调用的命令。
#
# Tauri 2 的 ACL 要求：一旦应用声明了权限清单，没被列进来的命令
# 连本机页面也调不动，而且失败只体现在页面里被忽略的 Promise 上。
# 新增命令后把它加到这里，src/main.rs 的单测会检查有没有漏。

[[permission]]
identifier = "local-commands"
description = "本机窗口可调用的全部命令"
