<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>NeuralKB 本地题库</title>
    <script>
        /* 首屏防闪烁：样式生效前先恢复上次选择的外观。 */
        try {
            var theme = localStorage.getItem('neuralkb.theme.v1') === 'dark' ? 'dark' : 'light';
            document.documentElement.dataset.theme = theme;
            document.documentElement.style.colorScheme = theme;
        } catch (e) {
            document.documentElement.dataset.theme = 'light';
        }
    </script>
</head>
<body>
<div id="root"><p style="font-family:system-ui;padding:24px">正在启动本地题库…</p></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
